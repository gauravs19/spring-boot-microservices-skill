# Baseline application.yml for a modern Spring Boot microservice.
# Environment-specific values come from env vars / profiles / config server —
# nothing secret or environment-specific is hardcoded here.

spring:
  application:
    name: orders-service

  # Thread-per-request on cheap virtual threads (Java 21+). Simple + scalable.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:}   # inject from secrets manager in real envs
    hikari:
      maximum-pool-size: 10          # size against DB capacity, not "bigger is better"
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate             # NEVER update/create in prod; Flyway owns schema
    open-in-view: false              # avoid lazy-loading surprises at serialization time

  mvc:
    problemdetails:
      enabled: true                  # RFC 9457 Problem Details error bodies

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:}   # validates signature/issuer/expiry

# Graceful shutdown: let in-flight requests finish during rolling deploys
server:
  shutdown: graceful
lifecycle:
  timeout-per-shutdown-phase: 30s

# Observability + Kubernetes health probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness & /readiness
      show-details: when_authorized
  tracing:
    sampling:
      probability: 0.1              # tune to traffic volume
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Structured JSON logs, correlated to traces by trace id automatically
logging:
  structured:
    format:
      console: ecs

# Resilience defaults for an outbound dependency named "inventory"
resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
